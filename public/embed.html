<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VidFun Embed Player</title>
  <link rel="stylesheet" href="/css/embed.css" />
  <script src="/vendor/hls.min.js"></script>
</head>
<body>
  <div id="player-root" class="player-root">
    <!-- Top Floating Bar: Title, Server Switcher, Episodes Drawer Trigger -->
    <header id="top-bar" class="top-bar">
      <div class="top-left">
        <span class="brand-pill">VIDFUN</span>
        <div class="media-meta">
          <h1 id="media-title" class="media-title">Loading stream...</h1>
          <span id="media-subtitle" class="media-subtitle">Resolving sources</span>
        </div>
      </div>

      <div class="top-right">
        <!-- Server / Provider Selector -->
        <div class="dropdown-wrap">
          <button id="server-btn" class="top-pill-btn" type="button" title="Switch Stream Server">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
            <span id="active-server-label">VidFun Direct</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="server-menu" class="server-menu hidden">
            <div class="menu-header">Select Streaming Server</div>
            <div id="server-list" class="server-list"></div>
          </div>
        </div>

        <!-- Episodes Drawer Trigger (TV Shows Only) -->
        <button id="episodes-btn" class="top-pill-btn hidden" type="button" title="Seasons & Episodes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>Episodes</span>
        </button>
      </div>
    </header>

    <!-- Native Direct Video Layer -->
    <div id="direct-player-layer" class="direct-player-layer">
      <div id="backdrop-poster" class="backdrop-poster"></div>
      <video id="vf-video" class="vf-video" crossorigin="anonymous" playsinline preload="metadata"></video>
      <canvas id="synth-canvas" class="synth-canvas hidden" width="1280" height="720"></canvas>

      <!-- Custom Subtitle Overlay -->
      <div id="subtitle-overlay" class="subtitle-overlay"></div>

      <!-- Loading Spinner -->
      <div id="loading-spinner" class="loading-spinner hidden">
        <div class="spinner-ring"></div>
        <span id="loading-text">Loading HD Stream...</span>
      </div>

      <!-- Center Big Play Button -->
      <button id="center-play-btn" class="center-play-btn" type="button" aria-label="Play Video">
        <svg id="center-play-icon" width="38" height="38" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </button>

      <!-- Bottom Control Bar -->
      <div id="bottom-controls" class="bottom-controls">
        <!-- Scrubber Timeline -->
        <div id="timeline-container" class="timeline-container">
          <div id="timeline-hover-time" class="timeline-hover-time hidden">00:00</div>
          <div class="timeline-track">
            <div id="timeline-buffered" class="timeline-buffered"></div>
            <div id="timeline-progress" class="timeline-progress"></div>
            <div id="timeline-thumb" class="timeline-thumb"></div>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <!-- Play / Pause -->
            <button id="play-pause-btn" class="ctrl-btn" type="button" title="Play/Pause (Space)">
              <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="icon-pause" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            </button>

            <!-- Rewind 10s -->
            <button id="rewind-btn" class="ctrl-btn" type="button" title="Rewind 10s (←)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
            </button>

            <!-- Forward 10s -->
            <button id="forward-btn" class="ctrl-btn" type="button" title="Forward 10s (→)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </button>

            <!-- Next Episode (TV only) -->
            <button id="next-ep-btn" class="ctrl-btn next-ep-btn hidden" type="button" title="Next Episode">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 4 15 12 5 20 5 4"></polygon>
                <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
              </svg>
              <span>Next Ep</span>
            </button>

            <!-- Volume -->
            <div class="volume-group">
              <button id="mute-btn" class="ctrl-btn" type="button" title="Mute/Unmute (M)">
                <svg id="icon-vol-high" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <svg id="icon-vol-mute" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <line x1="23" y1="9" x2="17" y2="15"></line>
                  <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
              </button>
              <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.02" value="0.9" aria-label="Volume" />
            </div>

            <!-- Time Display -->
            <div class="time-display">
              <span id="current-time">00:00</span>
              <span class="time-sep">/</span>
              <span id="duration-time">00:00</span>
            </div>
          </div>

          <div class="controls-right">
            <!-- Subtitles / CC Menu -->
            <div class="popup-wrap">
              <button id="cc-btn" class="ctrl-btn active-sub" type="button" title="Subtitles / Captions (C)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="M7 15h4M15 15h2M7 11h2M13 11h4"></path>
                </svg>
              </button>
              <div id="cc-menu" class="popup-menu hidden">
                <div class="popup-title">Subtitles / CC</div>
                <div id="cc-options" class="popup-options"></div>
              </div>
            </div>

            <!-- Quality & Speed Settings -->
            <div class="popup-wrap">
              <button id="settings-btn" class="ctrl-btn" type="button" title="Quality & Playback Speed">
                <span id="quality-badge" class="quality-badge">1080p</span>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </button>
              <div id="settings-menu" class="popup-menu settings-popup hidden">
                <div class="popup-title">Stream Quality</div>
                <div id="quality-options" class="popup-options"></div>
                <div class="popup-divider"></div>
                <div class="popup-title">Playback Speed</div>
                <div id="speed-options" class="popup-options speed-grid"></div>
              </div>
            </div>

            <!-- Picture-in-Picture -->
            <button id="pip-btn" class="ctrl-btn" type="button" title="Picture-in-Picture">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <rect x="12" y="9" width="8" height="6" rx="1"></rect>
              </svg>
            </button>

            <!-- Fullscreen -->
            <button id="fullscreen-btn" class="ctrl-btn" type="button" title="Fullscreen (F)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Upstream External Embed Layer (VidSrc.xyz, VidSrc.icu, SuperEmbed, AutoEmbed, 2Embed) -->
    <div id="external-embed-layer" class="external-embed-layer hidden">
      <div class="external-toolbar">
        <div class="external-status">
          <span class="status-dot"></span>
          <span id="external-provider-name">VidSrc.xyz</span>
          <code id="external-provider-url" class="external-url-code">https://vidsrc.xyz/embed/...</code>
        </div>
        <div class="external-actions">
          <button id="scrape-current-btn" class="ext-action-btn" type="button">
            🔍 Scrape Direct Stream
          </button>
          <a id="external-open-tab" href="#" target="_blank" rel="noopener noreferrer" class="ext-action-btn">
            ↗ Open Tab
          </a>
          <button id="switch-direct-btn" class="ext-action-btn primary" type="button">
            ⚡ Use VidFun Direct Player
          </button>
        </div>
      </div>

      <iframe
        id="external-iframe"
        class="external-iframe"
        src="about:blank"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="origin"
      ></iframe>

      <!-- Scrape Inspector Overlay inside External Layer -->
      <div id="scrape-overlay" class="scrape-overlay hidden">
        <div class="scrape-modal">
          <div class="scrape-modal-header">
            <h3>Scraper &amp; Unpacker Result</h3>
            <button id="close-scrape-overlay" class="close-icon-btn" type="button">✕</button>
          </div>
          <div id="scrape-modal-body" class="scrape-modal-body"></div>
        </div>
      </div>
    </div>

    <!-- Slide-out Episodes Drawer (TV Shows) -->
    <aside id="episodes-drawer" class="episodes-drawer hidden">
      <div class="drawer-header">
        <div>
          <h3>Seasons &amp; Episodes</h3>
          <p id="drawer-show-title" class="drawer-subtitle">Select episode</p>
        </div>
        <button id="close-drawer-btn" class="close-icon-btn" type="button">✕</button>
      </div>
      <div id="season-tabs" class="season-tabs"></div>
      <div id="episode-list" class="episode-list"></div>
    </aside>
  </div>

  <script src="/js/embed-player.js"></script>
</body>
</html>
