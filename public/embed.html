<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VidFun Player</title>
<link rel="stylesheet" href="/css/embed.css" />
<script src="/vendor/hls.min.js"></script>
</head>
<body>
<div id="root">
  <video id="video" playsinline crossorigin="anonymous" poster=""></video>
  <iframe id="frame" class="hidden" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="origin"></iframe>

  <div id="spinner"><div class="ring"></div><p id="spinner-text">Scraping sources…</p></div>

  <button id="big-play" class="hidden" aria-label="Play">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
  </button>

  <div id="toast" class="hidden"></div>

  <header id="bar">
    <div class="left">
      <span class="brand">VIDFUN</span>
      <div class="meta">
        <strong id="title">Loading…</strong>
        <small id="status">resolving</small>
      </div>
    </div>
    <div class="right">
      <span id="mode-badge" class="badge">…</span>
      <select id="server" title="Server"></select>
      <span id="ep-nav" class="hidden">
        <button id="ep-prev" title="Previous episode">⏮</button>
        <label>S <input id="in-s" type="number" min="1" value="1"></label>
        <label>E <input id="in-e" type="number" min="1" value="1"></label>
        <button id="ep-go">Go</button>
        <button id="ep-next" title="Next episode">⏭</button>
      </span>
    </div>
  </header>

  <footer id="controls">
    <div id="seek-wrap"><div id="seek-bg"><div id="seek-buf"></div><div id="seek-played"></div></div></div>
    <div class="row">
      <div class="group">
        <button id="btn-play">▶</button>
        <button id="btn-back">⏪ 10</button>
        <button id="btn-fwd">10 ⏩</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="1">
        <span id="time">0:00 / 0:00</span>
      </div>
      <div class="group">
        <select id="quality" class="hidden" title="Quality"></select>
        <select id="speed" title="Speed">
          <option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option>
        </select>
        <select id="subs" title="Subtitles"><option value="">Subs off</option></select>
        <button id="btn-pip">PiP</button>
        <button id="btn-fs">⛶</button>
      </div>
    </div>
  </footer>

  <div id="fatal" class="hidden">
    <h2>No playable source found</h2>
    <p id="fatal-detail"></p>
    <div id="fatal-servers"></div>
  </div>
</div>
<script src="/js/embed-player.js"></script>
</body>
</html>
